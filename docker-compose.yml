# ══════════════════════════════════════════════════════════════════
# DeepFake Detection – Docker Compose
# ══════════════════════════════════════════════════════════════════

services:

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: deepfake-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin123}
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - deepfake-net

  python-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: deepfake-worker:latest
    container_name: deepfake-python-worker
    environment:
      PYTHONUNBUFFERED: "1"
      MODEL_PATH: ${MODEL_PATH:-/app/models/best_swinv2.pth}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-admin123}
      ANALYSIS_QUEUE: analysis_queue
      RESULT_QUEUE: result_queue
      WORKER_THREADS: ${WORKER_THREADS:-4}
    volumes:
      - ./models:/app/models:ro
    env_file:
      - path: .env
        required: false
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - deepfake-net

volumes:
  rabbitmq_data:
    driver: local

networks:
  deepfake-net:
    driver: bridge